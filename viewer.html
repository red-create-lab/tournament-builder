<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大会結果 | トーナメントビルダー</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12213A">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy:#12213A; --navy2:#1B3358; --blue:#185FA5; --amber:#F2A93B;
    --court:#E9EDF3; --paper:#F6F7FA; --white:#FFFFFF;
    --win:#2E7D5B; --lose:#C24B4B; --sub:#5C6B84;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--navy);font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;}
  .app{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
  .board{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy2) 100%);
    border-radius:14px;padding:20px 24px;color:#fff;margin-bottom:20px;
  }
  .board .tag{font-size:11px;color:#9FB0CC;letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
  .board h1{font-size:20px;margin:6px 0 4px;font-weight:800;}
  .board .updated{font-size:11px;color:#9FB0CC;}
  .panel{background:#fff;border:1px solid #DDE3ED;border-radius:12px;padding:20px 22px;margin-bottom:16px;}
  .panel h2{font-size:14px;margin:0 0 10px;font-weight:800;color:var(--navy2);}
  .tabbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .tab{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;background:var(--court);color:var(--navy2);cursor:pointer;}
  .tab.active{background:var(--navy);color:#fff;}
  table.standings{width:100%;border-collapse:collapse;font-size:13px;}
  table.standings th{text-align:center;font-size:10.5px;color:var(--sub);text-transform:uppercase;padding:6px 4px;border-bottom:2px solid #E5EAF2;}
  table.standings td{text-align:center;padding:7px 4px;border-bottom:1px solid #EDF0F5;}
  table.standings td.name{text-align:left;font-weight:700;}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--court);font-weight:800;font-size:11px;}
  .rank-badge.top{background:var(--amber);color:var(--navy);}
  .match-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid #EDF0F5;font-size:13px;}
  .match-row:last-child{border-bottom:none;}
  .match-team{flex:1;font-weight:600;}
  .match-team.left{text-align:right;}
  .match-team.win{color:var(--win);font-weight:800;}
  .match-team.win::before{content:"✓ ";}
  .match-team.lose{color:var(--sub);text-decoration:line-through;text-decoration-color:#C4CCDA;opacity:0.75;}
  .score{min-width:50px;text-align:center;font-weight:800;background:var(--court);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums;}
  .next-tag{background:var(--amber);color:var(--navy);border-radius:20px;padding:3px 9px;font-size:10.5px;font-weight:800;}
  .bracket-wrap{overflow-x:auto;}
  .bracket{display:flex;gap:28px;min-width:max-content;position:relative;}
  .round-col{display:flex;flex-direction:column;justify-content:space-around;min-width:180px;position:relative;z-index:1;}
  .round-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);text-align:center;margin-bottom:8px;font-weight:700;}
  .bmatch{background:var(--paper);border:1.5px solid #DDE3ED;border-radius:10px;margin:8px 0;padding:8px 10px;position:relative;z-index:1;}
  .bslot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px;font-size:12.5px;font-weight:600;}
  .bslot .bname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .bslot .bscore{flex:none;min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800;background:var(--court);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--navy);}
  .bslot.win{color:var(--win);font-weight:800;}
  .bslot.win::before{content:"✓ ";}
  .bslot.lose{color:var(--sub);text-decoration:line-through;text-decoration-color:#C4CCDA;opacity:0.7;}
  .champion-banner{margin-top:16px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:24px;text-align:center;}
  .champion-banner .tag{font-size:11px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;font-weight:700;}
  .champion-banner .name{font-size:26px;font-weight:800;margin-top:6px;}
  .champion-banner .sub{font-size:12.5px;color:#C7D5E8;margin-top:10px;}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px;}
  .bracket-lines{position:absolute;left:0;top:0;pointer-events:none;z-index:0;}
  /* ---- v6.0: タイムスケジュール・自分のチーム ---- */
  .pick{display:flex;align-items:center;gap:10px;}
  .pick label{font-size:12.5px;font-weight:800;white-space:nowrap;}
  .pick select{flex:1;min-width:0;font-family:inherit;font-size:15px;font-weight:700;padding:9px 10px;border:1.5px solid var(--amber);border-radius:8px;background:#fff;color:var(--navy);}
  .mine{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
  .mi{display:flex;align-items:center;gap:8px;background:#FDF6E8;border-radius:8px;padding:8px 10px;font-size:13px;flex-wrap:wrap;}
  .mi .t{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;min-width:46px;}
  .mi .c{font-size:11px;font-weight:800;background:var(--navy);color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap;}
  .mi .lb{font-size:10.5px;font-weight:800;color:var(--sub);white-space:nowrap;}
  .mi .vs{flex:1;font-weight:700;min-width:6em;}
  .mi .res{font-size:12px;font-weight:800;white-space:nowrap;}
  .mi.done{background:#F1F3F7;color:var(--sub);}
  .mine-empty{font-size:12.5px;color:var(--sub);margin-top:10px;}
  .vt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.vt{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
  table.vt th{font-size:10.5px;color:var(--sub);text-align:left;padding:6px 4px;border-bottom:2px solid #E5EAF2;}
  table.vt th.tm{width:52px;}
  table.vt td{padding:4px 3px;border-bottom:1px solid #EDF0F5;vertical-align:top;}
  table.vt td.tm{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;padding-top:9px;}
  table.vt td.tm .n{display:block;font-size:9.5px;color:var(--sub);font-weight:700;}
  .vc{border-radius:7px;padding:5px 6px;}
  .vc.hl{background:#FDF0D8;box-shadow:inset 0 0 0 2px var(--amber);}
  .vc .rl{font-size:10px;font-weight:800;color:var(--sub);margin-bottom:1px;}
  .ln{display:flex;justify-content:space-between;gap:4px;font-weight:600;line-height:1.55;}
  .ln span:first-child{overflow-wrap:anywhere;}
  .ln .s{font-weight:800;font-variant-numeric:tabular-nums;flex:none;}
  .ln.w{color:var(--win);font-weight:800;}
  .ln.l{color:var(--sub);text-decoration:line-through;text-decoration-color:#C4CCDA;opacity:.75;}
  .ln.tbd{color:#9AA6B8;font-size:11.5px;}
  .ln.me{font-weight:800;}
  .emp{color:#B5BFCE;font-size:11px;padding:8px 6px;}
  tr.brk td{background:#FBF3E4;color:#8A5A10;font-weight:800;font-size:12px;padding:8px;}
  tr.endrow td{background:#EEF1F6;color:var(--navy2);font-weight:800;font-size:12px;padding:8px;}
  tr.gaprow td{color:#9AA6B8;font-size:11.5px;font-weight:700;padding:8px 6px;}
  .match-row.hl{background:#FDF0D8;border-radius:8px;box-shadow:inset 0 0 0 2px var(--amber);}
  .bmatch.hl{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber);}
  .bwhen{display:flex;align-items:center;gap:6px;margin:-2px 0 4px;}
  .bwhen .when-t{font-size:11.5px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;}
  .bwhen .when-c{font-size:10px;font-weight:800;background:var(--navy);color:#fff;border-radius:5px;padding:1px 6px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="board"><div class="tag">Live Viewer</div><h1>読み込み中…</h1></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCLcr6_JHz_5HgiwUNVGJ9nJKg0nvY1UNY",
  authDomain: "tournament-builder-65c70.firebaseapp.com",
  projectId: "tournament-builder-65c70",
  storageBucket: "tournament-builder-65c70.firebasestorage.app",
  messagingSenderId: "1098639992944",
  appId: "1:1098639992944:web:9625f6ddf65cb5f1c5ecb5"
};

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let data = null;
function deserializeData(raw){
  const out = Object.assign({}, raw);
  out.groups = (raw.groups||[]).map(g=> (g && g.teamIds) ? g.teamIds : (Array.isArray(g)?g:[]) );
  if(raw.bracket){
    out.bracket = {
      size: raw.bracket.size,
      rounds: (raw.bracket.rounds||[]).map(r=> (r && r.matches) ? r.matches : (Array.isArray(r)?r:[]) ),
      thirdPlaceMatch: raw.bracket.thirdPlaceMatch || null,
    };
  } else {
    out.bracket = null;
  }
  // v6.0: コート別の並び（Firestore保存用に包んでいるのを戻す）
  const unwrap = (raw, key)=> Array.isArray(raw) ? raw.map(r=> (r && Array.isArray(r[key])) ? r[key] : (Array.isArray(r)?r:[])) : null;
  out.courtSchedule = unwrap(raw.courtSchedule, 'matchIds');
  out.bracketSchedule = unwrap(raw.bracketSchedule, 'keys');
  return out;
}
let activeGroupTab = 0;

/* ============ v6.0: コート・タイムスケジュール ============ */
function courtName(c){ return `${String.fromCharCode(65+c)}コート`; }
function maxSlots(lists){ return (lists||[]).reduce((n,l)=>Math.max(n,(l||[]).length),0); }
function parseHM(s){ const m=/^(\d{1,2}):(\d{2})/.exec(s||''); if(!m) return null; const h=+m[1], mi=+m[2]; if(h>23||mi>59) return null; return h*60+mi; }
function fmtHM(min){ min=((Math.round(min)%1440)+1440)%1440; return `${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}`; }
function computeSlotTimes(cfg, nSlots){
  if(!cfg || !cfg.enabled) return null;
  const start = parseHM(cfg.start); if(start===null) return null;
  const dur = Math.max(1, Number(cfg.duration)||15);
  const byAfter = {};
  (cfg.breaks||[]).forEach(b=>{ const a=Number(b.after); if(a>=1 && a<nSlots) (byAfter[a]=byAfter[a]||[]).push(b); });
  const times=[], breaksAfter={}; let t=start;
  for(let i=1;i<=nSlots;i++){
    times.push(t); t+=dur;
    if(byAfter[i]) breaksAfter[i] = byAfter[i].map(b=>{ const mn=Math.max(0,Number(b.minutes)||0); const s=t; t+=mn; return {label:(b.label||'').trim()||'休憩', start:s, end:t}; });
  }
  return {times, breaksAfter, end:t};
}
function slotText(tm, i){ return tm ? fmtHM(tm.times[i]) : `第${i+1}試合`; }
function hasScores(m){ return m.scoreA!==null && m.scoreA!=='' && m.scoreA!==undefined && m.scoreB!==null && m.scoreB!=='' && m.scoreB!==undefined; }
// 予選のコート別の並びが使えるか（不完全なデータなら従来の1列表示に戻す）
function prelimLists(){
  const courts = Number(data.prelimCourts)||1;
  const useTable = courts>1 || !!(data.prelimTime && data.prelimTime.enabled);
  if(!useTable) return null;
  const lists = data.courtSchedule;
  if(!Array.isArray(lists) || lists.length!==courts) return null;
  const ids = lists.flat().filter(x=>x!==null && x!==undefined);
  if(ids.length!==(data.matches||[]).length) return null;
  return lists;
}
const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function roundLabelFor(total, ri){ const r=total-ri; if(r===1) return '決勝'; if(r===2) return '準決勝'; if(r===3) return '準々決勝'; return `${ri+1}回戦`; }
function bracketMatchLabel(key){
  if(key==='tp') return '3位決定戦';
  const [ri,mi] = key.split('-').map(Number);
  const rounds = data.bracket.rounds;
  const base = roundLabelFor(rounds.length, ri);
  return rounds[ri].length>1 ? base + (CIRCLED[mi]||`-${mi+1}`) : base;
}
function bracketMatchByKey(key){
  if(key==='tp') return data.bracket.thirdPlaceMatch;
  const [ri,mi] = String(key).split('-').map(Number);
  return (data.bracket.rounds[ri]||[])[mi] || null;
}
function bracketLists(){
  if(!data.bracket) return null;
  const courts = Number(data.bracketCourts)||1;
  const use = courts>1 || !!(data.bracketTime && data.bracketTime.enabled);
  if(!use || !Array.isArray(data.bracketSchedule) || data.bracketSchedule.length!==courts) return null;
  return data.bracketSchedule;
}
function positionsOf(lists){ const pos={}; (lists||[]).forEach((l,c)=> l.forEach((k,i)=>{ if(k!==null && k!==undefined) pos[k]={c,i}; })); return pos; }
function feederText(key, side){
  if(key==='tp'){ const sr=data.bracket.rounds.length-2; return `${bracketMatchLabel(`${sr}-${side==='a'?0:1}`)}の敗者`; }
  const [ri,mi] = key.split('-').map(Number);
  if(ri===0) return '（未定）';
  return `${bracketMatchLabel(`${ri-1}-${2*mi+(side==='a'?0:1)}`)}の勝者`;
}

// 自分のチーム（この端末だけに覚えておく）
let myTeam = null;
try{ const v = localStorage.getItem('tb-viewer-team-'+(new URLSearchParams(location.search).get('v')||'')); if(v) myTeam = Number(v); }catch(e){}
function setMyTeam(id){
  myTeam = id;
  try{ const k='tb-viewer-team-'+(new URLSearchParams(location.search).get('v')||''); if(id) localStorage.setItem(k,String(id)); else localStorage.removeItem(k); }catch(e){}
  render();
}
function isMine(m){ return !!myTeam && m && (m.a===myTeam || m.b===myTeam); }

function renderMyTeamPanel(){
  const teams = data.teams||[];
  if(!teams.length) return null;
  if(myTeam && !teams.some(t=>t.id===myTeam)) myTeam = null;
  const box = el(`<div class="panel" style="padding:16px;"></div>`);
  const pick = el(`<div class="pick"><label>自分のチーム</label><select><option value="">選択してください</option>${teams.map(t=>`<option value="${t.id}" ${t.id===myTeam?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}</select></div>`);
  pick.querySelector('select').addEventListener('change', e=> setMyTeam(e.target.value ? Number(e.target.value) : null));
  box.appendChild(pick);
  if(!myTeam) return box;

  const items = [];
  // 予選
  const pl = prelimLists();
  if(pl){
    const tm = computeSlotTimes(data.prelimTime, maxSlots(pl));
    for(let i=0;i<maxSlots(pl);i++) pl.forEach((l,c)=>{
      const m = (data.matches||[]).find(x=>x.id===l[i]);
      if(isMine(m)) items.push({m, t:slotText(tm,i), court: pl.length>1?courtName(c):'', label: data.groups.length>1?`予選 グループ${String.fromCharCode(65+m.groupIdx)}`:'予選'});
    });
  } else {
    const schedule = data.schedule && data.schedule.length ? data.schedule : (data.matches||[]).map(m=>m.id);
    schedule.forEach((mid,i)=>{ const m=(data.matches||[]).find(x=>x.id===mid); if(isMine(m)) items.push({m, t:`第${i+1}試合`, court:'', label:'予選'}); });
  }
  // 決勝
  if(data.bracket){
    const bl = bracketLists();
    if(bl){
      const tm = computeSlotTimes(data.bracketTime, maxSlots(bl));
      for(let i=0;i<maxSlots(bl);i++) bl.forEach((l,c)=>{
        const k = l[i]; if(k===null||k===undefined) return;
        const m = bracketMatchByKey(k);
        if(isMine(m)) items.push({m, key:k, t:slotText(tm,i), court: bl.length>1?courtName(c):'', label: bracketMatchLabel(k), bracket:true});
      });
    } else {
      data.bracket.rounds.forEach((round,ri)=> round.forEach((m,mi)=>{
        if(isMine(m) && m.a!=='BYE' && m.b!=='BYE') items.push({m, key:`${ri}-${mi}`, t:'', court:'', label: bracketMatchLabel(`${ri}-${mi}`), bracket:true});
      }));
      const m3 = data.bracket.thirdPlaceMatch;
      if(isMine(m3)) items.push({m:m3, t:'', court:'', label:'3位決定戦', bracket:true});
    }
  }
  const list = el(`<div class="mine"></div>`);
  items.forEach(it=>{
    const m = it.m;
    const opp = m.a===myTeam ? m.b : m.a;
    const oppName = (opp===null||opp===undefined) ? (it.key ? feederText(it.key, m.a===myTeam?'b':'a') : '（未定）') : (opp==='BYE' ? 'シード' : teamName(data,opp));
    let res = '', done = false;
    if(m.forfeitWinner){ done = true; res = m.forfeitWinner===myTeam ? '<span class="res" style="color:var(--win)">不戦勝</span>' : '<span class="res" style="color:var(--lose)">不戦敗</span>'; }
    else if(hasScores(m)){
      done = true;
      const my = m.a===myTeam ? Number(m.scoreA) : Number(m.scoreB);
      const op = m.a===myTeam ? Number(m.scoreB) : Number(m.scoreA);
      const r = my>op ? ['勝','var(--win)'] : my<op ? ['負','var(--lose)'] : ['分','var(--amber-dark,#C9821F)'];
      res = `<span class="res" style="color:${r[1]}">${r[0]} ${my}-${op}</span>`;
    }
    list.appendChild(el(`
      <div class="mi ${done?'done':''}">
        ${it.t?`<span class="t">${escapeHtml(it.t)}</span>`:''}
        ${it.court?`<span class="c">${escapeHtml(it.court)}</span>`:''}
        <span class="vs"><span class="lb">${escapeHtml(it.label)}</span><br>vs ${escapeHtml(oppName)}</span>
        ${res}
      </div>
    `));
  });
  if(items.length) box.appendChild(list);
  else box.appendChild(el(`<p class="mine-empty">このチームの試合はまだありません。</p>`));
  return box;
}

// 時刻×コートの表（閲覧用・コンパクト）
function renderVTable(lists, cfg, cellHtml, endLabel){
  const n = maxSlots(lists);
  const tm = computeSlotTimes(cfg, n);
  const rows = [];
  for(let i=0;i<n;i++){
    const allEmpty = lists.every(l=> l[i]===null || l[i]===undefined);
    const tmCell = `<td class="tm">${tm?fmtHM(tm.times[i]):''}<span class="n">第${i+1}試合</span></td>`;
    if(allEmpty) rows.push(`<tr class="gaprow">${tmCell}<td colspan="${lists.length}">— 空き時間</td></tr>`);
    else rows.push(`<tr>${tmCell}${lists.map(l=> `<td>${(l[i]===null||l[i]===undefined)?'<div class="emp">—</div>':cellHtml(l[i])}</td>`).join('')}</tr>`);
    if(tm && tm.breaksAfter[i+1]) tm.breaksAfter[i+1].forEach(b=> rows.push(`<tr class="brk"><td colspan="${lists.length+1}">☕ ${escapeHtml(b.label)} ${fmtHM(b.start)}〜${fmtHM(b.end)}</td></tr>`));
  }
  if(tm && n>0) rows.push(`<tr class="endrow"><td colspan="${lists.length+1}">🏁 ${escapeHtml(endLabel)} ${fmtHM(tm.end)}</td></tr>`);
  return el(`<div class="vt-wrap"><table class="vt" style="min-width:${lists.length>2?lists.length*140+52:0}px;"><thead><tr><th class="tm">${tm?'時刻':'順番'}</th>${lists.map((_,c)=>`<th>${courtName(c)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`);
}
function vcellLines(m, aText, bText, aTbd, bTbd){
  const w = m.forfeitWinner || (hasScores(m) && Number(m.scoreA)!==Number(m.scoreB) ? (Number(m.scoreA)>Number(m.scoreB)?m.a:m.b) : (m.winner||null));
  const ac = w ? (w===m.a?'w':'l') : '', bc = w ? (w===m.b?'w':'l') : '';
  const sa = m.forfeitWinner ? (m.forfeitWinner===m.a?'不戦勝':'') : (hasScores(m)?m.scoreA:'');
  const sb = m.forfeitWinner ? (m.forfeitWinner===m.b?'不戦勝':'') : (hasScores(m)?m.scoreB:'');
  const me = t=> (myTeam && t===myTeam) ? ' me' : '';
  return `<div class="ln ${ac}${me(m.a)}${aTbd?' tbd':''}"><span>${escapeHtml(aText)}</span><span class="s">${escapeHtml(String(sa))}</span></div>
          <div class="ln ${bc}${me(m.b)}${bTbd?' tbd':''}"><span>${escapeHtml(bText)}</span><span class="s">${escapeHtml(String(sb))}</span></div>`;
}
function renderPrelimTimetable(lists){
  const box = el(`<div class="panel" style="padding:14px 10px;"><h2 style="padding-left:4px;">🕒 タイムスケジュール</h2></div>`);
  box.appendChild(renderVTable(lists, data.prelimTime, id=>{
    const m = (data.matches||[]).find(x=>x.id===id);
    if(!m) return '';
    const g = data.groups.length>1 ? `<div class="rl">グループ${String.fromCharCode(65+m.groupIdx)}</div>` : '';
    return `<div class="vc ${isMine(m)?'hl':''}">${g}${vcellLines(m, teamName(data,m.a), teamName(data,m.b))}</div>`;
  }, '予選終了'));
  return box;
}
function renderBracketTimetable(lists){
  const box = el(`<div class="panel" style="padding:14px 10px;"><h2 style="padding-left:4px;">🕒 決勝トーナメントのタイムスケジュール</h2></div>`);
  box.appendChild(renderVTable(lists, data.bracketTime, key=>{
    const m = bracketMatchByKey(key);
    if(!m) return '';
    const aT = m.a===null||m.a===undefined, bT = m.b===null||m.b===undefined;
    const aText = aT ? feederText(key,'a') : (m.a==='BYE'?'シード':teamName(data,m.a));
    const bText = bT ? feederText(key,'b') : (m.b==='BYE'?'シード':teamName(data,m.b));
    return `<div class="vc ${isMine(m)?'hl':''}"><div class="rl">${escapeHtml(bracketMatchLabel(key))}</div>${vcellLines(m, aText, bText, aT, bT)}</div>`;
  }, '大会終了'));
  return box;
}

function teamName(data, id){
  if(id===null||id===undefined||id==='BYE') return null;
  const t = (data.teams||[]).find(t=>t.id===id);
  return t ? t.name : '???';
}

function calcGroupStandings(data, groupIdx){
  const groupTeamIds = data.groups[groupIdx];
  const gMatches = (data.matches||[]).filter(m=>m.groupIdx===groupIdx);
  const stats = {};
  groupTeamIds.forEach(id=>{ stats[id]={id,wins:0,draws:0,losses:0,played:0,pf:0,pa:0}; });
  gMatches.forEach(m=>{
    if(m.forfeitWinner){
      const w=m.forfeitWinner, l=m.a===w?m.b:m.a;
      if(stats[w]&&stats[l]){ stats[w].played++; stats[w].wins++; stats[l].played++; stats[l].losses++; }
      return;
    }
    if(m.scoreA===null||m.scoreA===''||m.scoreB===null||m.scoreB==='') return;
    const sa=Number(m.scoreA), sb=Number(m.scoreB);
    if(isNaN(sa)||isNaN(sb)) return;
    stats[m.a].played++; stats[m.b].played++;
    stats[m.a].pf+=sa; stats[m.a].pa+=sb;
    stats[m.b].pf+=sb; stats[m.b].pa+=sa;
    if(sa>sb){ stats[m.a].wins++; stats[m.b].losses++; }
    else if(sb>sa){ stats[m.b].wins++; stats[m.a].losses++; }
    else { stats[m.a].draws++; stats[m.b].draws++; }
  });
  Object.values(stats).forEach(s=> s.points = s.wins*3+s.draws);
  const ordered = groupTeamIds.slice().sort((a,b)=>{
    if(stats[b].points!==stats[a].points) return stats[b].points-stats[a].points;
    const diffA = stats[a].pf-stats[a].pa, diffB = stats[b].pf-stats[b].pa;
    return diffB-diffA;
  });
  return ordered.map((id,i)=>({rank:i+1,id,name:teamName(data,id),...stats[id],diff:stats[id].pf-stats[id].pa}));
}

function matchScoreText(m){
  if(m.forfeitWinner) return '不戦勝';
  const hasScores = m.scoreA!==null && m.scoreA!=='' && m.scoreB!==null && m.scoreB!=='';
  return hasScores ? `${m.scoreA} - ${m.scoreB}` : '';
}

let viewerTab = null; // 'prelim' | 'bracket'
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!data){
    app.appendChild(el(`<div class="board"><div class="tag">Live Viewer</div><h1>大会が見つかりませんでした</h1></div>`));
    app.appendChild(el(`<div class="panel"><p class="empty">リンクをもう一度確認してください。</p></div>`));
    return;
  }
  const title = (data.tournamentName && data.tournamentName.trim()) ? data.tournamentName.trim() : '大会結果';
  const updatedText = data.updatedAt && data.updatedAt.toDate ? `最終更新：${data.updatedAt.toDate().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}` : '';
  app.appendChild(el(`
    <div class="board">
      <div class="tag">Live Viewer</div>
      <h1>${escapeHtml(title)}</h1>
      <div class="updated">${updatedText}</div>
    </div>
  `));

  const hasPrelim = data.matches && data.matches.length>0;
  const hasBracket = !!data.bracket;

  if(!hasPrelim && !hasBracket){
    app.appendChild(el(`<div class="panel"><p class="empty">まだ大会が始まっていません。運営者が予選を組むとここに表示されます。</p></div>`));
    return;
  }

  if(viewerTab===null) viewerTab = hasBracket ? 'bracket' : 'prelim';

  if(hasPrelim && hasBracket){
    const tabbar = el(`<div class="tabbar"></div>`);
    const t1 = el(`<div class="tab ${viewerTab==='prelim'?'active':''}">予選結果</div>`);
    const t2 = el(`<div class="tab ${viewerTab==='bracket'?'active':''}">決勝トーナメント</div>`);
    t1.addEventListener('click', ()=>{ viewerTab='prelim'; render(); });
    t2.addEventListener('click', ()=>{ viewerTab='bracket'; render(); });
    tabbar.appendChild(t1); tabbar.appendChild(t2);
    app.appendChild(tabbar);
  }

  const mine = renderMyTeamPanel();
  if(mine) app.appendChild(mine);

  if((viewerTab==='bracket' || !hasPrelim) && hasBracket){
    const bracketPanel = renderBracketPanel();
    app.appendChild(bracketPanel);
    drawBracketConnectors(bracketPanel.querySelector('.bracket'));
    const champ = getFinalStandings();
    if(champ) app.appendChild(renderChampionBanner(champ));
    const bl = bracketLists();
    if(bl) app.appendChild(renderBracketTimetable(bl));
  } else if(hasPrelim){
    const pl = prelimLists();
    app.appendChild(pl ? renderPrelimTimetable(pl) : renderSchedulePanel());
    app.appendChild(renderStandingsPanel());
  }
}

function renderSchedulePanel(){
  const box = el(`<div class="panel"><h2>📋 対戦スケジュール</h2></div>`);
  const schedule = data.schedule && data.schedule.length ? data.schedule : data.matches.map(m=>m.id);
  const nextId = schedule.find(mid=>{
    const m = data.matches.find(x=>x.id===mid);
    if(!m) return false;
    const hasScores = m.scoreA!==null && m.scoreA!=='' && m.scoreB!==null && m.scoreB!=='';
    return !hasScores && !m.forfeitWinner;
  });
  schedule.forEach((mid,i)=>{
    const m = data.matches.find(x=>x.id===mid);
    if(!m) return;
    const hasScores = m.scoreA!==null && m.scoreA!=='' && m.scoreB!==null && m.scoreB!=='';
    const decided = hasScores && Number(m.scoreA)!==Number(m.scoreB);
    let aCls='',bCls='';
    if(decided){ if(Number(m.scoreA)>Number(m.scoreB)){aCls='win';bCls='lose';} else {bCls='win';aCls='lose';} }
    const groupLabel = data.groups.length>1 ? `グループ${String.fromCharCode(65+m.groupIdx)}` : '';
    const row = el(`
      <div class="match-row ${isMine(m)?'hl':''}">
        <span class="rank-badge">${i+1}</span>
        ${groupLabel?`<span class="tab" style="cursor:default;">${groupLabel}</span>`:''}
        <span class="match-team left ${aCls}">${escapeHtml(teamName(data,m.a))}</span>
        <span class="score">${matchScoreText(m)||'−'}</span>
        <span class="match-team ${bCls}">${escapeHtml(teamName(data,m.b))}</span>
        ${mid===nextId?'<span class="next-tag">▶ 次の試合</span>':''}
      </div>
    `);
    box.appendChild(row);
  });
  return box;
}

function renderStandingsPanel(){
  const box = el(`<div class="panel"><h2>順位表</h2></div>`);
  const tabbar = el(`<div class="tabbar"></div>`);
  if(data.groups.length>1){
    data.groups.forEach((_,gi)=>{
      const tab = el(`<div class="tab ${gi===activeGroupTab?'active':''}">グループ${String.fromCharCode(65+gi)}</div>`);
      tab.addEventListener('click', ()=>{ activeGroupTab=gi; render(); });
      tabbar.appendChild(tab);
    });
    box.appendChild(tabbar);
  }
  const gi = data.groups.length>1 ? activeGroupTab : 0;
  const standings = calcGroupStandings(data, gi);
  const table = el(`
    <table class="standings">
      <thead><tr><th>順位</th><th style="text-align:left;">チーム</th><th>勝</th><th>分</th><th>敗</th><th>勝点</th><th>得失点差</th></tr></thead>
      <tbody></tbody>
    </table>
  `);
  const tbody = table.querySelector('tbody');
  standings.forEach(s=>{
    tbody.appendChild(el(`
      <tr>
        <td><span class="rank-badge ${s.rank<=2?'top':''}">${s.rank}</span></td>
        <td class="name">${escapeHtml(s.name)}</td>
        <td>${s.wins}</td><td>${s.draws}</td><td>${s.losses}</td><td><b>${s.points}</b></td>
        <td>${s.diff>0?'+':''}${s.diff}</td>
      </tr>
    `));
  });
  box.appendChild(table);
  return box;
}

function matchWinner(m){
  if(m.forfeitWinner) return m.forfeitWinner;
  if(m.a==='BYE' && m.b && m.b!=='BYE') return m.b;
  if(m.b==='BYE' && m.a && m.a!=='BYE') return m.a;
  if(m.a===null||m.b===null||m.a==='BYE'||m.b==='BYE') return (m.a==='BYE'||m.b==='BYE')?null:null;
  if(m.scoreA===null||m.scoreA===''||m.scoreB===null||m.scoreB==='') return null;
  const sa=Number(m.scoreA), sb=Number(m.scoreB);
  if(isNaN(sa)||isNaN(sb)||sa===sb) return null;
  return sa>sb?m.a:m.b;
}

function renderBracketPanel(){
  const box = el(`<div class="panel"><h2>🏆 決勝トーナメント</h2></div>`);
  const wrap = el(`<div class="bracket-wrap"></div>`);
  const bracketEl = el(`<div class="bracket"></div>`);
  const rounds = data.bracket.rounds;
  const roundNames = rounds.map((_,i)=>{
    const remaining = rounds.length-i;
    if(remaining===1) return '決勝';
    if(remaining===2) return '準決勝';
    if(remaining===3) return '準々決勝';
    return `${i+1}回戦`;
  });
  function scoreBadge(val){
    if(val===null || val===undefined || val==='') return '';
    return `<span class="bscore">${escapeHtml(String(val))}</span>`;
  }
  const bl = bracketLists();
  const bpos = positionsOf(bl);
  const btm = bl ? computeSlotTimes(data.bracketTime, maxSlots(bl)) : null;
  function buildMatchBox(m, key){
    const w = m.winner;
    const p = bpos[key];
    const whenHtml = p ? `<div class="bwhen"><span class="when-t">${escapeHtml(slotText(btm,p.i))}</span>${bl.length>1?`<span class="when-c">${courtName(p.c)}</span>`:''}</div>` : '';
    const aName = m.a===null?'（未定）':(m.a==='BYE'?'― シード ―':teamName(data,m.a));
    const bName = m.b===null?'（未定）':(m.b==='BYE'?'― シード ―':teamName(data,m.b));
    const aCls = w ? (m.a===w?'win':'lose') : '';
    const bCls = w ? (m.b===w?'win':'lose') : '';
    const showScores = !m.forfeitWinner && m.a && m.b && m.a!=='BYE' && m.b!=='BYE';
    const matchBox = el(`
      <div class="bmatch ${isMine(m)?'hl':''}">
        ${whenHtml}
        <div class="bslot ${aCls}"><span class="bname">${escapeHtml(aName)}</span>${showScores?scoreBadge(m.scoreA):''}</div>
        <div style="height:1px;background:#E5EAF2;margin:2px 0;"></div>
        <div class="bslot ${bCls}"><span class="bname">${escapeHtml(bName)}</span>${showScores?scoreBadge(m.scoreB):''}</div>
      </div>
    `);
    if(m.forfeitWinner){
      matchBox.appendChild(el(`<p style="margin:6px 2px 0;font-size:11px;color:var(--lose);font-weight:700;">不戦勝・不戦敗</p>`));
    }
    return matchBox;
  }
  rounds.forEach((round, ri)=>{
    const col = el(`<div class="round-col"><div class="round-title">${roundNames[ri]}</div></div>`);
    round.forEach((m,mi)=>{ col.appendChild(buildMatchBox(m, `${ri}-${mi}`)); });
    bracketEl.appendChild(col);
  });
  if(data.bracket.thirdPlaceMatch && (data.bracket.thirdPlaceMatch.a || data.bracket.thirdPlaceMatch.b)){
    const col = el(`<div class="round-col"><div class="round-title">3位決定戦</div></div>`);
    col.appendChild(buildMatchBox(data.bracket.thirdPlaceMatch, 'tp'));
    bracketEl.appendChild(col);
  }
  wrap.appendChild(bracketEl);
  box.appendChild(wrap);
  return box;
}

function drawBracketConnectors(container){
  if(!container) return;
  const containerRect = container.getBoundingClientRect();
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('class','bracket-lines');
  svg.setAttribute('width', container.scrollWidth);
  svg.setAttribute('height', container.scrollHeight);
  const GREEN = '#1F9260', GRAY = '#AAB4C6';
  function drawPath(d, color, width){
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d', d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', width);
    path.setAttribute('stroke-linecap','round');
    svg.appendChild(path);
  }
  const rounds = data.bracket.rounds;
  const roundCols = container.querySelectorAll('.round-col');
  for(let ri=0; ri<rounds.length-1; ri++){
    const col = roundCols[ri];
    const nextCol = roundCols[ri+1];
    if(!col || !nextCol) continue;
    const boxes = col.querySelectorAll('.bmatch');
    const nextBoxes = nextCol.querySelectorAll('.bmatch');
    rounds[ri].forEach((m, mi)=>{
      const box = boxes[mi];
      const nextBox = nextBoxes[Math.floor(mi/2)];
      if(!box || !nextBox) return;
      const slots = box.querySelectorAll('.bslot');
      if(slots.length<2) return;
      const nextSlots = nextBox.querySelectorAll('.bslot');
      if(nextSlots.length<2) return;
      const slotARect = slots[0].getBoundingClientRect();
      const slotBRect = slots[1].getBoundingClientRect();
      const boxRect = box.getBoundingClientRect();
      const targetSlot = (mi%2===0) ? nextSlots[0] : nextSlots[1];
      const targetRect = targetSlot.getBoundingClientRect();
      const nextRect = nextBox.getBoundingClientRect();

      const startX = boxRect.right - containerRect.left;
      const aY = slotARect.top + slotARect.height/2 - containerRect.top;
      const bY = slotBRect.top + slotBRect.height/2 - containerRect.top;
      const mergeX = startX + 22;
      const mergeY = (aY+bY)/2;
      const endX = nextRect.left - containerRect.left;
      const endY = targetRect.top + targetRect.height/2 - containerRect.top;

      const colorA = (m.winner && m.winner===m.a) ? GREEN : GRAY;
      const colorB = (m.winner && m.winner===m.b) ? GREEN : GRAY;
      const widthA = (m.winner && m.winner===m.a) ? 4 : 1.5;
      const widthB = (m.winner && m.winner===m.b) ? 4 : 1.5;

      drawPath(`M ${startX} ${aY} H ${mergeX}`, colorA, widthA);
      drawPath(`M ${startX} ${bY} H ${mergeX}`, colorB, widthB);

      drawPath(`M ${mergeX} ${aY} V ${mergeY}`, colorA, widthA);
      drawPath(`M ${mergeX} ${mergeY} V ${bY}`, colorB, widthB);

      const advanced = !!m.winner;
      const trunkColor = advanced ? GREEN : GRAY;
      const trunkWidth = advanced ? 4 : 1.5;
      drawPath(`M ${mergeX} ${mergeY} H ${(mergeX+endX)/2} V ${endY} H ${endX}`, trunkColor, trunkWidth);
    });
  }
  container.insertBefore(svg, container.firstChild);
}

function getFinalStandings(){
  const rounds = data.bracket.rounds;
  const finalRound = rounds[rounds.length-1];
  if(finalRound.length!==1) return null;
  const finalMatch = finalRound[0];
  const champion = matchWinner(finalMatch);
  if(!champion) return null;
  const runnerUp = finalMatch.a===champion?finalMatch.b:finalMatch.a;
  let thirdNames = [];
  if(rounds.length>=2){
    const semis = rounds[rounds.length-2];
    function loserOf(sm){
      if(!sm||sm.a==='BYE'||sm.b==='BYE') return null;
      const w = matchWinner(sm);
      if(!w) return null;
      return sm.a===w?sm.b:sm.a;
    }
    const m3 = data.bracket.thirdPlaceMatch;
    if(m3){
      const w3 = (m3.a&&!m3.b)?m3.a:(m3.b&&!m3.a)?m3.b:matchWinner(m3);
      if(w3) thirdNames=[teamName(data,w3)];
    } else {
      thirdNames = [loserOf(semis[0]), loserOf(semis[1])].filter(Boolean).map(id=>teamName(data,id));
    }
  }
  return {
    championName: teamName(data,champion),
    runnerUpName: (runnerUp && runnerUp!=='BYE') ? teamName(data,runnerUp) : null,
    thirdNames
  };
}

function renderChampionBanner(champ){
  const parts = [`🏆 ${escapeHtml(champ.championName)}`];
  const sub = [];
  if(champ.runnerUpName) sub.push(`🥈 準優勝：${escapeHtml(champ.runnerUpName)}`);
  if(champ.thirdNames.length) sub.push(`🥉 3位：${champ.thirdNames.map(escapeHtml).join('・')}`);
  return el(`
    <div class="champion-banner">
      <div class="tag">Champion</div>
      <div class="name">${parts[0]}</div>
      <div class="sub">${sub.join('　')}</div>
    </div>
  `);
}

// ---- boot ----
const params = new URLSearchParams(location.search);
const viewToken = params.get('v');
if(!viewToken){
  document.getElementById('app').innerHTML = '<div class="panel"><p class="empty">リンクが正しくありません。運営者から共有されたリンクを開き直してください。</p></div>';
} else {
  try{
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.collection('public_view').doc(viewToken).onSnapshot(
      doc=>{
        const raw = doc.exists ? doc.data() : null;
        data = raw ? deserializeData(raw) : null;
        render();
      },
      err=>{
        console.error(err);
        document.getElementById('app').innerHTML = '<div class="panel"><p class="empty">読み込みに失敗しました。通信環境をご確認ください。</p></div>';
      }
    );
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML = '<div class="panel"><p class="empty">読み込みに失敗しました。通信環境をご確認ください。</p></div>';
  }
}
